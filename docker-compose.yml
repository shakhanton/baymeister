# Локальна інфраструктура для розробки блоків.
# Самі сервіси запускаються з хоста: uv run uvicorn app.main:app --reload
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: baymeister
      POSTGRES_PASSWORD: baymeister
      POSTGRES_DB: baymeister
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baymeister"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
