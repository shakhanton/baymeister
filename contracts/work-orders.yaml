openapi: 3.1.0

info:
  title: Baymeister — Наряд-замовлення
  version: 1.0.0
  description: |
    Блок `work-orders` — ядро системи. Наряд: хто приїхав, на чому, що зробили,
    які деталі поставили і скільки це коштує.

    **Ціни фіксуються в момент додавання рядка.** Робота чи запчастина береться з
    `catalog` з поточною ціною, і ця ціна лишається в наряді. Зміна прайсу не
    переписує відкриті й закриті наряди.

    **Знижка клієнта фіксується при відкритті наряду** — з `customers`.

    Гроші — рядком із двома знаками (`"1147.50"`), кількість — рядком із трьома
    (`"4.500"` л оливи), як у `catalog`.

    Клієнт і автомобіль — посилання плюс копія імені, телефону й держномера, що
    оновлюється подіями `customer.updated` і `vehicle.updated`.

servers:
  - url: /api
    description: Gateway маршрутизує все під /api/work-orders у цей сервіс.

tags:
  - name: orders
    description: Наряди
  - name: lines
    description: Роботи й запчастини в наряді
  - name: health
    description: Службові

paths:
  /health:
    get:
      tags: [health]
      summary: Перевірка живості сервісу
      security: []
      responses:
        "200":
          description: Сервіс живий
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /work-orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Список нарядів, від нових до старих
      description: Потрібне право `work_orders.read`.
      parameters:
        - name: search
          in: query
          description: Номер наряду, держномер або імʼя клієнта
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: customer_id
          in: query
          schema: { type: string, format: uuid }
        - name: vehicle_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Сторінка результатів
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [orders]
      operationId: openOrder
      summary: Відкрити наряд
      description: |
        Потрібне право `work_orders.write`. Клієнт і авто перевіряються в
        `customers` і `vehicles` від імені того самого користувача; авто має
        належати цьому клієнту.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreate" }
      responses:
        "201":
          description: Наряд відкрито
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "422":
          description: Дані не пройшли валідацію, клієнта чи авто не існує, авто не цього клієнта
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /work-orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [orders]
      operationId: getOrder
      summary: Наряд з рядками й сумами
      description: Потрібне право `work_orders.read`.
      responses:
        "200":
          description: Наряд
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [orders]
      operationId: updateOrder
      summary: Змінити скаргу, пробіг чи примітку
      description: Потрібне право `work_orders.write`. Лише поки наряд не закрито.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderUpdate" }
      responses:
        "200":
          description: Оновлений наряд
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Locked" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /work-orders/{orderId}/status:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [orders]
      operationId: changeOrderStatus
      summary: Змінити статус наряду
      description: |
        Потрібне право `work_orders.write`. Дозволені переходи:

        | з | у |
        |---|---|
        | `open` | `in_progress`, `cancelled` |
        | `in_progress` | `done`, `cancelled` |
        | `done` | `closed`, `in_progress` |

        `done` — роботи завершено; тоді публікується `order.completed`.
        `closed` — авто видано клієнту, наряд більше не змінюється.
        `done` без жодного рядка неможливий — порожній наряд лише скасовують.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Наряд із новим статусом
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Такий перехід недозволений
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /work-orders/{orderId}/lines:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [lines]
      operationId: addLine
      summary: Додати роботу або запчастину
      description: |
        Потрібне право `work_orders.write` і `catalog.read`. Назва, код і ціна
        беруться з `catalog` у цей момент і зберігаються в наряді.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineCreate" }
      responses:
        "201":
          description: Наряд із новим рядком
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Locked" }
        "422":
          description: |
            Позиції немає в каталозі, вона архівна, або в роботи невідома ціна
            (не задана вартість нормо-години)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /work-orders/{orderId}/lines/{lineId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - name: lineId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [lines]
      operationId: updateLine
      summary: Змінити кількість
      description: Потрібне право `work_orders.write`. Ціна не змінюється.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty]
              properties:
                qty: { $ref: "#/components/schemas/QtyInput" }
      responses:
        "200":
          description: Оновлений наряд
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Locked" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [lines]
      operationId: removeLine
      summary: Прибрати рядок
      description: Потрібне право `work_orders.write`.
      responses:
        "200":
          description: Наряд без цього рядка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Locked" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен видає блок `identity`, перевіряє gateway.

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Немає або недійсний токен
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Бракує права: читання потребує `work_orders.read`, зміни — `work_orders.write`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Не знайдено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Locked:
      description: Наряд у статусі, в якому його не можна змінювати
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Дані не пройшли валідацію
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Сусідній блок (`customers`, `vehicles`, `catalog`) недоступний
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Money:
      type: string
      pattern: "^-?\\d{1,11}\\.\\d{2}$"
      examples: ["1147.50"]

    Qty:
      type: string
      pattern: "^\\d{1,6}\\.\\d{3}$"
      description: Кількість із трьома знаками — «4.500» л, «1.000» шт.
      examples: ["1.000"]

    QtyInput:
      type: string
      pattern: "^\\d{1,6}([.,]\\d{1,3})?$"
      description: Приймається й «4,5»
      examples: ["4,5"]

    OrderStatus:
      type: string
      enum: [open, in_progress, done, closed, cancelled]
      description: |
        `open` — прийнято, `in_progress` — в роботі, `done` — роботи завершено,
        `closed` — видано клієнту, `cancelled` — скасовано.

    Line:
      type: object
      required: [id, kind, catalog_id, code, name, qty, unit, unit_price, amount]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [service, part] }
        catalog_id: { type: string, format: uuid }
        code:
          type: string
          description: Код роботи або «БРЕНД АРТИКУЛ» запчастини на момент додавання
        name: { type: string }
        qty: { $ref: "#/components/schemas/Qty" }
        unit: { type: string, examples: ["pcs", "l", "h"] }
        unit_price:
          $ref: "#/components/schemas/Money"
          description: Ціна з каталогу на момент додавання
        amount:
          $ref: "#/components/schemas/Money"
          description: qty × unit_price, до копійки

    Totals:
      type: object
      required: [services, parts, subtotal, discount_percent, discount, total]
      properties:
        services: { $ref: "#/components/schemas/Money" }
        parts: { $ref: "#/components/schemas/Money" }
        subtotal: { $ref: "#/components/schemas/Money" }
        discount_percent:
          type: string
          description: Знижка клієнта, зафіксована при відкритті наряду
          examples: ["5.00"]
        discount: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }

    OrderSummary:
      type: object
      required:
        [id, number, status, customer_id, customer_name, customer_phone, vehicle_id, vehicle_label, total, opened_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        number:
          type: string
          description: Людський номер — рік і порядковий номер у цьому році
          examples: ["2026-00042"]
        status: { $ref: "#/components/schemas/OrderStatus" }
        customer_id: { type: string, format: uuid }
        customer_name: { type: string }
        customer_phone: { type: string }
        vehicle_id: { type: string, format: uuid }
        vehicle_label: { type: string, examples: ["AA1234BC · Volkswagen Golf"] }
        total: { $ref: "#/components/schemas/Money" }
        opened_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Order:
      allOf:
        - $ref: "#/components/schemas/OrderSummary"
        - type: object
          required: [lines, totals]
          properties:
            appointment_id: { type: [string, "null"], format: uuid }
            complaint:
              type: [string, "null"]
              description: Зі слів клієнта — «стукає спереду справа»
            mileage_km: { type: [integer, "null"] }
            notes: { type: [string, "null"] }
            lines:
              type: array
              items: { $ref: "#/components/schemas/Line" }
            totals: { $ref: "#/components/schemas/Totals" }
            done_at: { type: [string, "null"], format: date-time }
            closed_at: { type: [string, "null"], format: date-time }

    OrderPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderSummary" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    OrderCreate:
      type: object
      required: [customer_id, vehicle_id]
      properties:
        customer_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        appointment_id:
          type: [string, "null"]
          format: uuid
          description: Запис у `scheduling`, з якого відкрито наряд
        complaint: { type: [string, "null"], maxLength: 2000 }
        mileage_km: { type: [integer, "null"], minimum: 0, maximum: 9999999 }

    OrderUpdate:
      type: object
      minProperties: 1
      properties:
        complaint: { type: [string, "null"], maxLength: 2000 }
        mileage_km: { type: [integer, "null"], minimum: 0, maximum: 9999999 }
        notes: { type: [string, "null"], maxLength: 2000 }

    LineCreate:
      type: object
      required: [kind, catalog_id]
      properties:
        kind: { type: string, enum: [service, part] }
        catalog_id: { type: string, format: uuid }
        qty: { $ref: "#/components/schemas/QtyInput" }

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Повідомлення, придатне для показу користувачу
          examples: ["Наряд 2026-00042 закрито — змінювати його не можна"]

security:
  - bearerAuth: []
