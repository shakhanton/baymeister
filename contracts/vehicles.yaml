openapi: 3.1.0

info:
  title: Baymeister — Автомобілі
  version: 1.0.0
  description: |
    Блок `vehicles`. Володіє автомобілями клієнтів: VIN, держномер, марка,
    модель, рік і історія пробігу.

    Власник автомобіля — клієнт із блоку `customers`. Тут зберігається його
    `customer_id` і власна копія імені й телефону, яку блок оновлює за подією
    `customer.updated`. Тому список автомобілів показує власника без жодного
    запиту до `customers`.

    Що блок НЕ віддає: наряди по автомобілю (блок `work-orders`), результати
    оглядів (блок `inspections`).

servers:
  - url: /api
    description: |
      Gateway маршрутизує за першим сегментом шляху: усе під /api/vehicles
      потрапляє в цей сервіс.

tags:
  - name: vehicles
    description: Автомобілі
  - name: mileage
    description: Історія пробігу
  - name: health
    description: Службові

paths:
  /health:
    get:
      tags: [health]
      summary: Перевірка живості сервісу
      security: []
      responses:
        "200":
          description: Сервіс живий
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /vehicles:
    get:
      tags: [vehicles]
      operationId: listVehicles
      summary: Список автомобілів
      description: Потрібне право `vehicles.read`.
      parameters:
        - name: search
          in: query
          description: Пошук за держномером, VIN, маркою, моделлю або іменем власника
          schema: { type: string, maxLength: 120 }
        - name: customer_id
          in: query
          description: Тільки автомобілі цього клієнта
          schema: { type: string, format: uuid }
        - name: archived
          in: query
          description: Показати архівовані замість активних
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Сторінка результатів
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehiclePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [vehicles]
      operationId: createVehicle
      summary: Додати автомобіль
      description: |
        Потрібне право `vehicles.write`. Сервіс перевіряє клієнта в `customers`
        і запамʼятовує його імʼя й телефон.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleCreate" }
      responses:
        "201":
          description: Автомобіль створено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "409":
          description: Автомобіль із таким VIN або держномером уже існує
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Дані не пройшли валідацію або клієнта не існує
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Блок `customers` недоступний — власника перевірити неможливо
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /vehicles/{vehicleId}:
    parameters:
      - $ref: "#/components/parameters/VehicleId"

    get:
      tags: [vehicles]
      operationId: getVehicle
      summary: Автомобіль за ідентифікатором
      description: Потрібне право `vehicles.read`.
      responses:
        "200":
          description: Автомобіль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    patch:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Змінити автомобіль
      description: |
        Потрібне право `vehicles.write`. Передаються тільки поля, що змінюються.
        Зміна `customer_id` — це продаж автомобіля іншому клієнту.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleUpdate" }
      responses:
        "200":
          description: Оновлений автомобіль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: VIN або держномер належить іншому автомобілю
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Дані не пройшли валідацію або клієнта не існує
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Блок `customers` недоступний
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /vehicles/{vehicleId}/archive:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    post:
      tags: [vehicles]
      operationId: archiveVehicle
      summary: Архівувати автомобіль
      description: |
        Потрібне право `vehicles.write`. М'яке видалення: автомобіль зникає зі
        списків, але лишається доступним за ідентифікатором — наряди на нього
        посилаються.
      responses:
        "200":
          description: Архівований автомобіль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /vehicles/{vehicleId}/mileage:
    parameters:
      - $ref: "#/components/parameters/VehicleId"

    get:
      tags: [mileage]
      operationId: listMileage
      summary: Історія пробігу, від нових до старих
      description: Потрібне право `vehicles.read`.
      responses:
        "200":
          description: Показники одометра
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MileageReading" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [mileage]
      operationId: recordMileage
      summary: Записати показник одометра
      description: |
        Потрібне право `vehicles.write`. Пробіг не може бути меншим за
        попередній — інакше 409: або помилка введення, або скручений одометр,
        і в обох випадках людина має це побачити.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MileageCreate" }
      responses:
        "201":
          description: Показник записано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MileageReading" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Пробіг менший за останній записаний
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен видає блок `identity`, перевіряє gateway.

  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Немає або недійсний токен
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Бракує права: читання потребує `vehicles.read`, зміни — `vehicles.write`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Автомобіль не знайдено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Дані не пройшли валідацію
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Vin:
      type: string
      pattern: "^[A-HJ-NPR-Z0-9]{17}$"
      description: 17 символів, без I, O, Q. Приводиться до верхнього регістру.
      examples: ["WVWZZZ1KZAW123456"]

    Plate:
      type: string
      minLength: 2
      maxLength: 12
      description: |
        Держномер. Зберігається без пробілів і дефісів, у верхньому регістрі,
        кириличні літери-двійники замінюються латинськими: «АА1234ВС» і
        «AA 1234 BC» — один номер.
      examples: ["AA1234BC"]

    Vehicle:
      type: object
      required:
        [id, customer_id, customer_name, customer_phone, plate, make, model, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        customer_name:
          type: string
          description: Копія з `customers`, оновлюється подією `customer.updated`
        customer_phone:
          type: string
          description: Копія з `customers`, оновлюється подією `customer.updated`
        vin:
          oneOf:
            - $ref: "#/components/schemas/Vin"
            - type: "null"
        plate: { $ref: "#/components/schemas/Plate" }
        make: { type: string, examples: ["Volkswagen"] }
        model: { type: string, examples: ["Golf"] }
        year: { type: [integer, "null"], examples: [2010] }
        color: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        mileage_km:
          type: [integer, "null"]
          description: Останній записаний пробіг
        archived_at:
          type: [string, "null"]
          format: date-time
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VehicleCreate:
      type: object
      required: [customer_id, plate, make, model]
      properties:
        customer_id: { type: string, format: uuid }
        vin: { type: [string, "null"], pattern: "^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$" }
        plate: { type: string, minLength: 2, maxLength: 16 }
        make: { type: string, minLength: 1, maxLength: 60 }
        model: { type: string, minLength: 1, maxLength: 60 }
        year: { type: [integer, "null"], minimum: 1900, maximum: 2100 }
        color: { type: [string, "null"], maxLength: 40 }
        notes: { type: [string, "null"], maxLength: 2000 }
        mileage_km:
          type: [integer, "null"]
          minimum: 0
          maximum: 9999999
          description: Пробіг при прийманні — стає першим записом історії

    VehicleUpdate:
      type: object
      minProperties: 1
      properties:
        customer_id: { type: string, format: uuid }
        vin: { type: [string, "null"], pattern: "^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$" }
        plate: { type: string, minLength: 2, maxLength: 16 }
        make: { type: string, minLength: 1, maxLength: 60 }
        model: { type: string, minLength: 1, maxLength: 60 }
        year: { type: [integer, "null"], minimum: 1900, maximum: 2100 }
        color: { type: [string, "null"], maxLength: 40 }
        notes: { type: [string, "null"], maxLength: 2000 }

    VehiclePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Vehicle" }
        total: { type: integer, description: Усього записів за фільтром }
        limit: { type: integer }
        offset: { type: integer }

    MileageReading:
      type: object
      required: [id, vehicle_id, km, recorded_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        km: { type: integer, minimum: 0 }
        recorded_at: { type: string, format: date-time }
        note: { type: [string, "null"] }

    MileageCreate:
      type: object
      required: [km]
      properties:
        km: { type: integer, minimum: 0, maximum: 9999999 }
        note: { type: [string, "null"], maxLength: 200 }

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Повідомлення, придатне для показу користувачу
          examples: ["Автомобіль із держномером AA1234BC уже існує"]

security:
  - bearerAuth: []
